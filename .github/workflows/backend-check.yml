name: Backend check

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt

      - name: Check Python syntax (compile all files)
        working-directory: backend
        run: |
          python -m py_compile server.py

      - name: Import check (catches missing dependencies / broken imports)
        working-directory: backend
        run: |
          python -c "import ast; ast.parse(open('server.py').read())"