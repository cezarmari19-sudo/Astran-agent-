name: Build APK (manual)

on:
  workflow_dispatch:

env:
  EXPO_PUBLIC_BACKEND_URL: https://astran-agent.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: app/frontend
        run: yarn install --frozen-lockfile

      - name: Prebuild native Android project
        working-directory: app/frontend
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/frontend/android/**/*.gradle*', 'app/frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK with Gradle
        working-directory: app/frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        working-directory: app/frontend
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under android/app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" app-release.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/frontend/app-release.apk
          retention-days: 30